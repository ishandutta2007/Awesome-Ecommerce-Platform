<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.7; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.95; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatMedium {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(1deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -100; }
      }
      @keyframes shimmerBorder {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }

      .pulse-1 { animation: pulseGlow 9s ease-in-out infinite; transform-origin: 250px 180px; }
      .pulse-2 { animation: pulseGlow 12s ease-in-out infinite reverse; transform-origin: 950px 220px; }
      .float-a { animation: floatSlow 6s ease-in-out infinite; }
      .float-b { animation: floatMedium 7.5s ease-in-out infinite; }
      .float-c { animation: floatFast 5s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 8, 8; animation: dashFlow 20s linear infinite; }
      .shimmer { animation: shimmerBorder 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Subtle Background Grid Pattern -->
  <g opacity="0.12">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300 M 0 360 L 1200 360" stroke="#94a3b8" stroke-width="1" />
    <path d="M 120 0 L 120 420 M 240 0 L 240 420 M 360 0 L 360 420 M 480 0 L 480 420 M 600 0 L 600 420 M 720 0 L 720 420 M 840 0 L 840 420 M 960 0 L 960 420 M 1080 0 L 1080 420" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Dynamic Glowing Orbs (Deep Background) -->
  <circle class="pulse-1" cx="220" cy="160" r="180" fill="url(#glowGrad1)" filter="url(#blurFilter)" />
  <circle class="pulse-2" cx="980" cy="240" r="210" fill="url(#glowGrad2)" filter="url(#blurFilter)" />

  <!-- Flowing Network Connectors (Background Accent) -->
  <g opacity="0.35">
    <path class="flow-line" d="M 120 320 C 300 380, 500 340, 700 370 S 1000 300, 1100 340" fill="none" stroke="#60a5fa" stroke-width="2" />
    <path class="flow-line" d="M 100 100 C 350 40, 600 120, 850 70 S 1050 120, 1150 90" fill="none" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Floating Accent Pills (Safe Positions - Sides & Corners so they never overlap foreground text) -->
  <g class="float-a" opacity="0.85">
    <rect x="70" y="55" width="160" height="38" rx="19" fill="#1e293b" stroke="url(#cardBorderGrad)" stroke-width="1.5" />
    <circle cx="88" cy="74" r="6" fill="#10b981" />
    <text x="103" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚀 High Velocity</text>
  </g>

  <g class="float-b" opacity="0.85">
    <rect x="960" y="55" width="170" height="38" rx="19" fill="#1e293b" stroke="url(#cardBorderGrad)" stroke-width="1.5" />
    <circle cx="980" cy="74" r="6" fill="#38bdf8" />
    <text x="995" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Composable Core</text>
  </g>

  <g class="float-c" opacity="0.85">
    <rect x="65" y="335" width="175" height="38" rx="19" fill="#1e293b" stroke="url(#cardBorderGrad)" stroke-width="1.5" />
    <circle cx="83" cy="354" r="6" fill="#a855f7" />
    <text x="98" y="359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🛍️ Headless &amp; API</text>
  </g>

  <g class="float-a" opacity="0.85">
    <rect x="965" y="335" width="165" height="38" rx="19" fill="#1e293b" stroke="url(#cardBorderGrad)" stroke-width="1.5" />
    <circle cx="983" cy="354" r="6" fill="#f59e0b" />
    <text x="998" y="359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🏢 B2B &amp; Omnichannel</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed Front Layer) -->
  <g id="foreground-hero" filter="url(#dropShadow)">
    <!-- Category Badge -->
    <g transform="translate(485, 75)">
      <rect x="0" y="0" width="230" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="115" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#a5b4fc" letter-spacing="1.5" text-anchor="middle">🛒 ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="52" font-weight="900" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="-1">
      Awesome Ecommerce Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#f1f5f9" text-anchor="middle" letter-spacing="0.2">
      Curated Landscape of Enterprise SaaS Suites &amp; Leading Open-Source Engines
    </text>

    <!-- Micro Tags Row -->
    <text x="600" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Storefront Architecture • Headless Commerce • B2B &amp; DTC • High-Performance APIs • Multi-Tenant Clouds
    </text>

    <!-- Interactive Metric Badges Row -->
    <g transform="translate(360, 298)">
      <rect x="0" y="0" width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="70" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">✨ 10+ Enterprise SaaS</text>

      <rect x="170" y="0" width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="240" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a855f7" text-anchor="middle">🌟 15+ Open-Source</text>

      <rect x="340" y="0" width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="410" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#10b981" text-anchor="middle">📊 Pricing &amp; Metrics</text>
    </g>
  </g>

  <!-- Sleek Outer Border Highlight -->
  <rect class="shimmer" x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="url(#cardBorderGrad)" stroke-width="2" />
</svg>